[project]
name = "ee-generator"
version = "0.1.0"
description = "Seeded synthetic automotive E/E validation programme generator (fictional data)"
requires-python = ">=3.12"
dependencies = ["ee-domain"]

[project.scripts]
ee-generate = "ee_generator.cli:main"

[tool.uv.sources]
ee-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_generator"]
