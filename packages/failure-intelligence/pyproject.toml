[project]
name = "ee-failures"
version = "0.1.0"
description = "Deterministic recurring-failure fingerprinting"
requires-python = ">=3.12"
dependencies = ["ee-domain"]

[tool.uv.sources]
ee-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_failures"]
