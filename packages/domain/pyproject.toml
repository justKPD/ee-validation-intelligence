[project]
name = "ee-domain"
version = "0.1.0"
description = "Canonical E/E validation domain model"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_domain"]
