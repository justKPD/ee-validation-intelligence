[project]
name = "ee-provenance"
version = "0.1.0"
description = "Agent runs, recommendation lifecycle, human approvals and hash-chained provenance ledger"
requires-python = ">=3.12"
dependencies = ["ee-domain", "ee-policies"]

[tool.uv.sources]
ee-domain = { workspace = true }
ee-policies = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_provenance"]
