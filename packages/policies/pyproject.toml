[project]
name = "ee-policies"
version = "0.1.0"
description = "Default-deny authority policy gate for agent tool calls"
requires-python = ">=3.12"
dependencies = ["ee-domain"]

[tool.uv.sources]
ee-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_policies"]
