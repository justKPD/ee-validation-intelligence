[project]
name = "ee-evaluation"
version = "0.1.0"
description = "Shadow test planning benchmark and evaluation metrics"
requires-python = ">=3.12"
dependencies = ["ee-domain", "ee-etl", "ee-ranking", "ee-agent"]

[project.scripts]
ee-shadow = "ee_evaluation.cli:shadow_main"
ee-reliability = "ee_evaluation.cli:reliability_main"
ee-adversarial = "ee_evaluation.cli:adversarial_main"
ee-calibration = "ee_evaluation.cli:calibration_main"

[tool.uv.sources]
ee-domain = { workspace = true }
ee-etl = { workspace = true }
ee-ranking = { workspace = true }
ee-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_evaluation"]
