[project]
name = "ee-agent"
version = "0.1.0"
description = "Policy-gated agentic test planner: LangGraph orchestration, MCP-compatible tools, provider-agnostic model adapter"
requires-python = ">=3.12"
dependencies = [
    "ee-domain",
    "ee-ranking",
    "ee-policies",
    "ee-provenance",
    "langgraph>=1.2",
    "langchain-core>=1.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.6"]

[tool.uv.sources]
ee-domain = { workspace = true }
ee-ranking = { workspace = true }
ee-policies = { workspace = true }
ee-provenance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_agent"]
