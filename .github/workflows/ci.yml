name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ee
          POSTGRES_PASSWORD: ee_ci
          POSTGRES_DB: ee_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ee -d ee_validation" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --frozen --extra postgres
      - run: bash scripts/check.sh
      - name: Migrate + seed real Postgres
        env:
          EE_DATABASE_URL: postgresql+psycopg://ee:ee_ci@localhost:5432/ee_validation
        run: uv run ee-seed --seed 42
      - name: Benchmarks reproduce the committed seed-42 results
        run: |
          uv run ee-seed --seed 42
          uv run ee-shadow --out /tmp/shadow
          uv run ee-reliability -k 3 --out /tmp/reliability
          uv run python scripts/verify_reproduction.py /tmp/shadow /tmp/reliability

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
