[project]
name = "ee-validation-intelligence"
version = "0.1.0"
description = "E/E Validation Intelligence & Agentic Test Control Tower (synthetic-data portfolio platform)"
requires-python = ">=3.12"
dependencies = [
    "ee-domain",
    "ee-generator",
    "ee-etl",
    "ee-api",
    "ee-risk",
    "ee-coverage",
    "ee-failures",
    "ee-ranking",
    "ee-evaluation",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*", "data/generator"]

[tool.uv.sources]
ee-domain = { workspace = true }
ee-generator = { workspace = true }
ee-etl = { workspace = true }
ee-api = { workspace = true }
ee-risk = { workspace = true }
ee-coverage = { workspace = true }
ee-failures = { workspace = true }
ee-ranking = { workspace = true }
ee-evaluation = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is owned by `ruff format`

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps/api/tests", "data/generator/tests"]
addopts = "-q"
