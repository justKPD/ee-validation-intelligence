# Railway config-as-code for the public portfolio API service (see docs/adr/ADR-007-public-deployment-platform.md).
# The web app is deployed separately on Vercel; PostgreSQL + pgvector runs as its own Railway service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/api.Dockerfile"
# redeploy the API only when code, config, data generation, benchmarks or migrations change (not for docs-only commits)
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "data/generator/**",
  "config/**",
  "benchmarks/**",
  "migrations/**",
  "alembic.ini",
  "pyproject.toml",
  "uv.lock",
  "infra/docker/api.Dockerfile",
  ".dockerignore",
  "railway.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
