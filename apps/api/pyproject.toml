[project]
name = "ee-api"
version = "0.1.0"
description = "FastAPI service for E/E Validation Intelligence"
requires-python = ">=3.12"
dependencies = [
    "ee-domain",
    "ee-etl",
    "ee-risk",
    "ee-coverage",
    "ee-failures",
    "ee-ranking",
    "ee-policies",
    "ee-provenance",
    "ee-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.scripts]
ee-api = "ee_api.main:run"

[tool.uv.sources]
ee-domain = { workspace = true }
ee-etl = { workspace = true }
ee-risk = { workspace = true }
ee-coverage = { workspace = true }
ee-failures = { workspace = true }
ee-ranking = { workspace = true }
ee-policies = { workspace = true }
ee-provenance = { workspace = true }
ee-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ee_api"]
